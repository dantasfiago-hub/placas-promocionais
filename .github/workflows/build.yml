name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Placas.slnx
      - run: dotnet build Placas.slnx -c Release --no-restore
      - run: dotnet test tests/Placas.Tests/Placas.Tests.csproj -c Release --no-build --logger trx
      - run: dotnet publish src/Placas.Desktop/Placas.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: PlacasPromocionais-windows-x64
          path: artifacts/windows/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
